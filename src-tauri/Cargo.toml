[package]
name = "magnus"
version = "0.1.0"
description = "VDOT Safety Service Patrol Scene Management Simulator"
authors = ["GPD-Research"]
edition = "2021"

[lib]
name = "magnus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "magnus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
osmpbf = "0.3"
rstar = "0.11"
geo-types = "0.7"
geo = "0.28"
thiserror = "1.0"
log = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
