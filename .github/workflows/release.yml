name: Release

# Pushing a tag like v10.0.0-rc.2 builds the Linux .deb and attaches it to a
# GitHub Release of the same name, plus a stable-named copy so
# https://github.com/GPD-Research/Magnus/releases/latest/download/magnus_latest_amd64.deb
# always serves the newest release. Releases are never marked prerelease because GitHub's
# /releases/latest skips prereleases. Can also be run by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/topology-worker
      - run: npm ci
      - run: scripts/package-deb.sh
      - run: cp dist-deb/magnus_*_amd64.deb dist-deb/magnus_latest_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: magnus-deb
          path: dist-deb/*.deb
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-deb/*.deb
          generate_release_notes: true
