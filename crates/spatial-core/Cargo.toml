[package]
name = "magnus-spatial-core"
version = "8.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
osmpbf = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
